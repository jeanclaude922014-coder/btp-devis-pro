<template id="tplComprendre">
<section class="bloc"><h3>Principe</h3><div class="prose">
<p>Un dalot cadre est un tube rectangulaire en béton armé. On en isole une tranche de 1 m et on l'étudie comme un portique fermé : la dalle supérieure porte le remblai et les roues, les piédroits résistent à la poussée des terres, le radier renvoie l'ensemble au sol.</p>
<p>Le sol n'est pas un appui rigide. Il est représenté par des ressorts (modèle de Winkler) : la pression de contact vaut k fois le tassement. Un sol raide concentre la réaction sous les piédroits, un sol mou la répartit.</p></div></section>
<section class="bloc"><h3>Charges permanentes</h3><div class="prose">
<span class="formule">Poids propre       g = 25 × épaisseur                      (kN/m² )
Remblai            q = γ_remblai × Hr + γ_chaussée × e_ch  (kPa)
Poussée des terres p(z) = K × σv(z)      avec K0 = 1 − sin φ (formule de Jaky)</span>
<p>Un cadre fermé ne peut pas se déplacer pour mobiliser la poussée active : la poussée au repos K0 est donc proposée par défaut.</p></div></section>
<section class="bloc"><h3>Charges routières du Fascicule 61 titre II</h3><div class="prose">
<span class="formule">A(l) = 2,3 + 360 / (l + 12)   (kN/m², l en m), multiplié par a1 et a2 = v0 / v
δ    = 1 + 0,4 / (1 + 0,2 L) + 0,6 / (1 + 4 G / S)</span>
<ul><li>Bc : camions de 300 kN, essieux arrière de 120 kN distants de 1,50 m, roue de 60 kN sur 0,25 × 0,25 m.</li>
<li>Bt : deux essieux de 160 kN distants de 1,35 m, roue de 80 kN sur 0,60 × 0,25 m.</li>
<li>Br : roue isolée de 100 kN sur 0,60 × 0,30 m.</li>
<li>Mc120 : char de 1 100 kN, deux chenilles de 6,10 × 1,00 m.</li></ul>
<p>Chaque empreinte est élargie en traversant la chaussée (3/4 de son épaisseur de chaque côté), le remblai (angle saisi, 30° usuel) et la demi-épaisseur de la dalle (45°). Les roues voisines dont les zones diffusées se rejoignent sont regroupées, et l'on retient le regroupement qui donne la charge la plus forte par mètre de longueur d'ouvrage. Le convoi est ensuite déplacé pas à pas sur la dalle, dans les deux sens.</p></div></section>
<section class="bloc"><h3>Combinaisons</h3><div class="prose">
<span class="formule">BAEL + Fascicule 61   ELU : 1,35 G + 1,6 Q (A, B)   ou 1,35 Mc120
                      ELS :      G + 1,2 Q (A, B)   ou 1,00 Mc120
Eurocodes             ELU : 1,35 G + 1,35 Q trafic ;  ELS caractéristique : G + Q</span>
<p>Les actions permanentes sont aussi prises avec leur valeur favorable (1,0), et chaque action variable est présente ou absente. C'est ce qui produit, par exemple, le moment maximal en travée de dalle avec la poussée des terres minimale.</p></div></section>
<section class="bloc"><h3>Section d'acier en flexion simple</h3><div class="prose">
<span class="formule">ELU   µ = Mu / (b d² fbu)       α = 1,25 (1 − √(1 − 2µ))
      z = d (1 − 0,4 α)        As = Mu / (z fe / 1,15)
ELS   b x² / 2 = n As (d − x), n = 15     I = b x³ / 3 + n As (d − x)²
      σbc = M x / I ≤ 0,6 fc28            σs = n M (d − x) / I ≤ σs limite
BAEL, fissuration préjudiciable : σs limite = min( 2/3 fe ; max( 0,5 fe ; 110 √(1,6 ft28) ) )
Section minimale BAEL : As ≥ 0,23 b d ft28 / fe</span>
<p><b>Application numérique à refaire à la main</b> : Mu = 100 kN.m, b = 1 m, d = 0,25 m, fc28 = 25 MPa, Fe E500. fbu = 14,17 MPa ; µ = 0,100 / (0,25² × 14,17) = 0,1129 ; α = 0,1501 ; z = 0,235 m ; As = 0,100 / (0,235 × 434,8) = 9,79 cm². Le logiciel donne la même valeur (test automatique n° 4).</p>
<p>En Eurocode 2, la démarche est la même avec fcd = fck / 1,5. L'ouverture des fissures est calculée selon le § 7.3.4 sous la combinaison fréquente.</p></div></section>
<section class="bloc"><h3>Murs en aile</h3><div class="prose">
<span class="formule">Poussée (Coulomb, parement vertical) : Ka = cos²φ / ( cos δ [1 + √( sin(φ+δ) sin(φ−β) / (cos δ cos β) )]² ),  β ≤ φ
Voile en console : Mu = 1,35 Ka γ H³/6 + 1,6 Ka q H²/2   (BAEL)      q = surcharge routière × sin(angle de l'aile)
Semelle : renversement Ms / Mr ≥ 1,5 ; glissement μ ΣV / ΣH ≥ 1,5 ; (3 σmax + σmin) / 4 ≤ σadm</span>
<p>Application à refaire à la main : aile de 2,50 m, φ = 30°, γ = 20 kN/m³, q = 10 × sin 27° = 4,54 kPa. Ka = 1/3 ; Mu = 1,35 × 17,36 + 1,6 × 4,73 = 31,0 kN.m/m (test automatique n° 12).</p>
<p>Ailes sur radier de tête : les deux ailes et le radier forment un U ouvert. Les poussées s'équilibrent ; le radier reprend le moment d'encastrement des ailes. Murs en T : chaque tronçon est calculé à sa hauteur maximale, la semelle est élargie par pas de 5 cm jusqu'à vérifier la stabilité, les renforts verticaux s'arrêtent là où les barres continues suffisent, prolongés d'une longueur d'ancrage.</p></div></section>
<section class="bloc"><h3>Effort tranchant</h3><div class="prose">
<span class="formule">BAEL A.5.2.2 (dalle sans armature transversale) : τu = Vu / (b d) ≤ 0,07 fc28 / 1,5
EC2 § 6.2.2 : VRd,c = max( 0,12 k (100 ρ fck)^(1/3) ; 0,035 k^1,5 √fck ) b d,  k = 1 + √(200/d) ≤ 2</span></div></section>
<section class="bloc"><h3>Hydraulique</h3><div class="prose">
<span class="formule">Q = K × S × R^(2/3) × √i      S = L × y      R = S / (L + 2 y)</span>
<p>Exemple : K = 67, L = 2 m, y = 1 m, i = 0,5 %. S = 2 m², R = 0,5 m, Q = 67 × 2 × 0,63 × 0,0707 = 5,97 m³/s.</p></div></section>
</template>
